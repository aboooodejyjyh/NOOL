{% extends "base.html" %}

{% block title %}{% if object %}Edit Customer{% else %}Add Customer{% endif %}{% endblock %}

{% block content %}
  <h1>{% if object %}Edit Customer{% else %}Add Customer{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'customers:customer_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
